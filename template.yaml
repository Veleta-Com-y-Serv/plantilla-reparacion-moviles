# Metadatos de la plantilla para el catálogo de NoExpertise.
id: reparacion-moviles
nombre: Reparación de móviles e informática
descripcion: "Web tecnológica en negro y verde neón para servicios técnicos: reparaciones con precio, tienda y presupuesto."
sectores:
  - { id: reparacion-moviles, nombre: Reparación de móviles }
  - { id: informatica, nombre: Informática }
  - { id: tienda-tecnologia, nombre: Tienda de tecnología }
  - { id: telefonia, nombre: Telefonía }
  - { id: servicio-tecnico, nombre: Servicio técnico }
secciones:
  - { id: hero, nombre: Portada }
  - { id: reparaciones, nombre: Reparaciones }
  - { id: marcas, nombre: Marcas }
  - { id: proceso, nombre: Cómo trabajamos }
  - { id: garantias, nombre: Garantías }
  - { id: productos, nombre: Tienda }
  - { id: cifras, nombre: Cifras }
  - { id: opiniones, nombre: Opiniones }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: presupuesto, nombre: Presupuesto }
  - { id: contacto, nombre: Contacto }
estilo: tecnologico
plan_minimo: gratis
version: 1.1.0
base: astrowind
demo_url: https://demo-plantilla-reparacion-moviles.noexpertise.com
activa: true
orden: 580

# Páginas propias (docs/plantillas.md § Fichas por elemento y páginas por zona). Espejo en src/data/fichas.ts.
fichas:
  - { lista: reparaciones, campo: reparaciones, ruta: reparaciones, nombre: Reparación, tipo: Service }

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu tienda"
    pregunta: "¿Cómo se llama tu tienda o servicio técnico y qué aparatos reparáis?"
    ayuda: "Móviles, tablets, portátiles, consolas… y en qué barrio o pueblo estáis."
    tipo: texto
    campos: [nombre, eslogan, seo.titulo, seo.descripcion, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde está la tienda, qué horario tenéis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.instagram, redes.facebook]
  - id: reparaciones
    titulo: "Tus reparaciones"
    pregunta: "¿Qué reparaciones hacéis? Una por línea, con el aparato, el tiempo y el precio si quieres (por ejemplo «Cambio de pantalla de móvil, en 1 hora, desde 49 €»)."
    ayuda: "Si prefieres no poner precios, no los digas: los añades luego en Contenido."
    tipo: lista
    campos: [secciones.reparaciones.reparaciones]
  - id: marcas
    titulo: "Marcas"
    pregunta: "¿Con qué marcas trabajáis más?"
    ayuda: "Solo los nombres. Si no quieres este apartado, sáltalo."
    tipo: texto
    campos: [secciones.marcas.titulo, secciones.marcas.texto, secciones.marcas.items]
  - id: proceso
    titulo: "Cómo trabajáis"
    pregunta: "¿Qué pasa desde que un cliente entra con el aparato hasta que se lo lleva? ¿El diagnóstico es gratis?"
    tipo: texto
    campos: [secciones.proceso.titulo, secciones.proceso.texto, secciones.proceso.items]
  - id: garantias
    titulo: "Garantías"
    pregunta: "¿Qué garantía dais y qué os diferencia? Por ejemplo: préstamo de móvil, sin arreglo no se paga…"
    tipo: texto
    campos: [secciones.garantias.titulo, secciones.garantias.texto, secciones.garantias.items]
  - id: productos
    titulo: "Tu tienda"
    pregunta: "¿Vendéis fundas, accesorios o aparatos reacondicionados? Uno por línea, con el precio si quieres."
    ayuda: "Si no vendéis nada, sáltalo y oculta el apartado en Contenido."
    tipo: lista
    campos: [secciones.productos.productos]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo en el mostrador? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelas luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada de la tienda o del banco de trabajo y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.proceso.galeria, secciones.garantias.imagen, secciones.presupuesto.imagen, secciones.contacto.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
