# Contenido de la web. Es lo único que rellena la plataforma NoExpertise.
# Una sola página: el menú apunta a anclas (#id-de-sección).
# Las secciones se muestran en el orden de este fichero. Para ocultar una: activa: false.
# Apartado nuevo: un id propio (es su ancla, /#id) con `tipo:` = el diseño de otra sección o `texto`.
# Listas planas: nunca una lista dentro de un elemento de lista. Precios y cifras, siempre entre comillas.
nombre: Circuito Elx
eslogan: Reparación de móviles, tablets, portátiles y consolas en Elche. Diagnóstico gratis y presupuesto cerrado.
sector: reparacion-moviles
logo: ""          # ruta a una imagen en public/ (p. ej. /logo.svg). Vacío = inicial en chip verde + nombre.
colores:
  primario: "#3dff8f"   # verde neón (botones, bandas verdes, cursor, precios sobre negro)
  acento: "#0b7a3e"     # verde oscuro (textos y detalles verdes sobre fondo claro, foco)
  fondo: "#f3f4f5"      # gris muy claro
  texto: "#0c0e10"      # casi negro: la letra y también las bandas oscuras
contacto:
  telefono: "965 40 18 72"
  email: hola@circuitoelx.es
  direccion: Calle Reina Victoria 27, 03201 Elche (Alicante)
  horario: "Lunes a viernes, de 10:00 a 14:00 y de 17:00 a 20:30. Sábados, de 10:00 a 14:00."
  whatsapp: "+34 622 41 90 37"
redes:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  linkedin: ""
menu:
