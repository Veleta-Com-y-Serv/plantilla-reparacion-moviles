  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen al recoger el móvil
    testimonios:
      - { texto: "Se me cayó el móvil el sábado por la mañana y a mediodía ya lo tenía con la pantalla nueva. Me dijeron el precio antes y no cambió ni un euro.", autor: Nuria P., nota: "Cambio de pantalla, Altabix" }
      - { texto: "El portátil de mi hijo tardaba cinco minutos en arrancar. Le pusieron un disco nuevo y parece otro. Me explicaron todo sin tecnicismos.", autor: Javier S., nota: "Portátil lento, Carrús" }
      - { texto: "Me arreglaron los dos mandos de la consola en una hora mientras tomaba un café. Precio justo y muy majos.", autor: Marta G., nota: "Mandos de consola, El Pla" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntáis en el mostrador
    texto: "¿No encuentras la tuya? Escríbenos por WhatsApp y te contestamos enseguida."
    preguntas:
      - { pregunta: "¿Cuánto tarda un cambio de pantalla?", respuesta: "En la mayoría de los móviles, alrededor de una hora. Si tenemos que pedir la pieza, te decimos el día exacto al darte el presupuesto." }
      - { pregunta: "¿Voy a perder mis fotos y mis datos?", respuesta: "No. Las reparaciones de pantalla, batería o conector no tocan tus datos. Si hay que restaurar el sistema, te lo decimos antes y te ayudamos con la copia." }
      - { pregunta: "¿Cuánto cuesta el diagnóstico?", respuesta: "Nada. Miramos el aparato gratis y sin compromiso. Si decides no repararlo, te lo llevas tal cual." }
      - { pregunta: "¿Qué garantía tienen las reparaciones?", respuesta: "Seis meses en la pieza y en la mano de obra, por escrito en la factura. Si falla algo, vuelve y lo miramos." }
      - { pregunta: "¿Reparáis móviles que se han mojado?", respuesta: "Sí. Apágalo, no lo cargues y tráelo cuanto antes. Limpiamos la placa por ultrasonidos y te decimos si tiene arreglo." }

  presupuesto:
    activa: true
    antetitulo: Presupuesto
    titulo: Dinos qué le pasa y te damos el precio
    texto: "Elige el aparato, cuéntanos la avería y te contestamos con el precio y el tiempo de reparación."
    imagen: /fotos/presupuesto.jpg
    nota: "Sin compromiso. Te contestamos en menos de dos horas en horario de tienda."
