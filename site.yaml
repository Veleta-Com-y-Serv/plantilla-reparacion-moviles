  - { texto: Tienda, url: "/#productos" }
  - { texto: Opiniones, url: "/#opiniones" }
  - { texto: Contacto, url: "/#contacto" }
boton_cabecera: { texto: Pedir presupuesto, url: "/#presupuesto" }
seo:
  titulo: Circuito Elx · Reparación de móviles e informática en Elche
  descripcion: "Reparamos pantallas, baterías y conectores de móviles, tablets, portátiles y consolas en Elche. Diagnóstico gratis y muchas reparaciones en el día."
  tipo: ElectronicsStore
marca_pie: true

